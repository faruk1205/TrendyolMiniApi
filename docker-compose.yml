version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=BenimGucluSifrem123! # Kendi şifrenizle değiştirin
    ports:
      - "5341:80"
    volumes:
      - ./seq_data:/data
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    # Redis'in verileri belirli aralıklarla diske kaydetmesi için gerekli komut
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      # Önbellekteki verilerin kalıcı olması için yerel bir klasör oluşturur
      - ./redis_data:/data