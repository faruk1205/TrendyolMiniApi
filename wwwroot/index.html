<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Grup Sohbet Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: 0 auto; }
        input, button { font-size: 14px; padding: 8px; border-radius: 6px; border: 1px solid #ccc; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
        button { cursor: pointer; background: #f27a1a; color: white; border: none; }
        #messages { border: 1px solid #ccc; height: 350px; overflow-y: auto; padding: 10px; background: #fff; border-radius: 6px; margin-top: 10px; }
        .msg { margin-bottom: 6px; padding: 6px 10px; border-radius: 5px; font-size: 14px; }
        .mine { background: #dcf8c6; text-align: right; }
        .other { background: #f1f0f0; }
        .sys { background: #fee; color: #a33; font-size: 12px; text-align: center; }
        #sendRow { display: none; }
    </style>
</head>
<body>

<h3>Grup Sohbet Testi</h3>

<div id="setup">
    <input type="text" id="tokenInput" placeholder="JWT Token" />
    <input type="number" id="groupIdInput" placeholder="Grup ID" value="1" />
    <button onclick="connect()">Bağlan ve Gruba Katıl</button>
</div>

<div id="messages"></div>

<div id="sendRow">
    <input type="text" id="msgInput" placeholder="Mesajınız..." onkeydown="if(event.key==='Enter') send()" />
    <button onclick="send()">Gönder</button>
</div>

<script>
    let connection;
    let myUserId;
    let groupId;
    const API_BASE = ""; // Farklı bir origin'deyse buraya backend URL'ini yazın, örn: "https://localhost:7001"

    function appendMsg(text, cls) {
        const el = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.innerText = text;
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;
    }

    function decodeUserId(token) {
        // JWT'nin payload kısmını çözüp kullanıcı ID'sini "mine/other" ayrımı için çıkarıyoruz
        try {
            const payload = JSON.parse(atob(token.split(".")[1]));
            return payload.sub || payload.nameid || payload.userId || null;
        } catch { return null; }
    }

    async function connect() {
        const token = document.getElementById("tokenInput").value.trim();
        groupId = parseInt(document.getElementById("groupIdInput").value);
        if (!token || !groupId) { alert("Token ve Grup ID gerekli"); return; }

        myUserId = decodeUserId(token);

        // 1. Geçmiş mesajları REST'ten çek
        try {
            const res = await fetch(`${API_BASE}/api/messages/group/${groupId}`, {
                headers: { Authorization: "Bearer " + token }
            });
            const data = await res.json();

            if (data.isSuccess === false && data.data == null) {
                appendMsg("Geçmiş yüklenemedi: " + (data.message || "yetkisiz"), "sys");
            } else {
                const list = data.data || [];
                list.forEach(m => {
                    appendMsg(`Kullanıcı ${m.senderId}: ${m.content}`, m.isMine ? "mine" : "other");
                });
            }
        } catch (err) {
            appendMsg("Geçmiş çekilirken hata: " + err, "sys");
        }

        // 2. SignalR'a bağlan
        connection = new signalR.HubConnectionBuilder()
            .withUrl(`${API_BASE}/chathub?access_token=` + token)
            .withAutomaticReconnect()
            .build();

        connection.on("ReceiveGroupMessage", (id, senderId, content) => {
            appendMsg(`Kullanıcı ${senderId}: ${content}`, String(senderId) === String(myUserId) ? "mine" : "other");
        });

        connection.on("GroupMessageQueued", () => {
            // Sessizce geç, mesaj zaten kendi ekranımıza anında yazılıyor
        });

        try {
            await connection.start();
            await connection.invoke("JoinGroup", groupId);
            document.getElementById("setup").style.display = "none";
            document.getElementById("sendRow").style.display = "block";
            appendMsg("✅ Gruba bağlanıldı", "sys");
        } catch (err) {
            appendMsg("❌ Bağlantı/katılım hatası: " + err.message, "sys");
        }
    }

    function send() {
        const input = document.getElementById("msgInput");
        const content = input.value.trim();
        if (!content) return;

        connection.invoke("SendGroupMessage", groupId, content)
            .then(() => { input.value = ""; })
            .catch(err => appendMsg("❌ Hata: " + err.message, "sys"));
    }
</script>
</body>
</html>
